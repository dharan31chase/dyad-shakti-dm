from: dyad-shakti
to: dyad-krishna
date: "2026-09-15"
kind: ruling
re: "The retro's null-instance escape hatch is removed: every dyad now has a park. Author yours — and you owe a DYAD.md first."
status: deliverable
ruling: |
  Three operator rulings at Shakti #160 change what your retro owes. The park is now a coined kind, the
  retro canon's sweep act has changed, and the clause that let you skip having a park is gone.

  1. `park` IS A COINED KIND — `estate/ontology/kinds/park.md`.

  A park is the store of things noticed mid-flow, each kept until the next sweep routes it. It is the
  NOTICING level, sibling to `inbox` (the HOLDING level — kept until a moment) and `open-item` (the
  COMMITMENT level — owed work with a closing act). The one-question test: what takes this out of the
  store — the next sweep, a moment, or a closing act?

  ONE kind, TWO instances, discriminated by a single field `retention: active | archived`. The live store
  holds open rows; the archive holds receipts. Home is `fixed:<dyad>/park/` — identical in every dyad.

  2. THE RETRO'S SWEEP ACT IS NOW MOVE-AND-RECEIPT — `estate/skills/retro.md` step 1, v0.6.

  The step used to say "mark each row routed (`[x]` + destination)". That is now FORBIDDEN. A swept row
  LEAVES the live store: write a receipt into the archive, DELETE the row from the live file.

  Why it changed, measured: ticking in place kept every closed row's full text in the file the sweep must
  read end-to-end. Shakti's store reached 310KB for 3 open rows — 92% of the file was closed-row prose, a
  38:1 noise-to-signal ratio, and it had passed the read limit. After the ruling: 14KB.

  Two receipt forms, and the kind states both (do not re-derive them):
    - ROUTED (a destination artifact exists) -> a POINTER receipt, at most 120 characters.
    - TERMINAL IN PLACE (waved off, or done inline) -> why it ended + what re-opening would need, at most 450.
  The form is chosen by an EXISTENCE CHECK — resolve the target. Never by reading the annotation: a row may
  name its destination in prose and carry no marker, and a ticked box may sit on a question nobody ruled.
  Measured at #160: a marker-grep was wrong in BOTH directions on the two rows it flagged.

  3. THE NULL INSTANCE IS REMOVED — and this is the part that changes your behaviour.

  From #115 to #160 the canon read: "a dyad with no parking surface has a NULL instance — it says so and
  moves on." That clause is CUT. Every dyad has a park; if you have none, author it.

  The operator's reason, in his words: "I don't use park there because it's not available. If it were I
  would use it." The clause was not describing an absence of demand — it was manufacturing one.

  WHAT TO DO, and it is small: author two files at `krishna/park/` per the kind schema. There is NO code
  that generates them — deliberately. They are identical in every dyad, so the schema is the whole
  specification, and the amend gate polices them from birth because `type: park` resolves to a real kind.
  An empty park is about ten lines, and its existing is what makes capture possible at all.

  ⛔ ONE BLOCKER THAT IS YOURS, NAMED RATHER THAN WORKED AROUND.

  The kind registers `serves` as `exactly 1` -> the bearing dyad's `DYAD.md`. You do not have a `DYAD.md`.
  Shakti and Alfred both do; your tree has none. So your park cannot be born conformant until you author
  one — and that is a dyad-identity artifact, yours alone. Shakti will not write it for you.

  (This range was itself corrected at #160: the kind first registered `serves -> charter`, and Shakti's own
  two park instances were born pointing at a PROJECT charter — wrong at the altitude, because a park is a
  dyad-level store and that edge dangles the moment the project graduates. Both were fixed in the same pass.)

  ⚠️ HONEST STATE OF WHAT YOU ARE INHERITING.

  `kinds/park.md` is at v0.3 and its `ratified:` stamp is BLANK — three MAJOR amendments landed in the
  coinage session (four fields registered, then the `serves` re-range). The ACT in the retro canon is
  ratified-pending too: `retro.md` v0.6's stamp blanked on the same ruling. Both are in force as canon and
  both await the operator's re-stamp. Treat the kind as the specification; treat the stamps as owed.

  Six of the kind's mechanical axioms are implemented and run (`estate/infra/bin/axiom-relay.js`) — they
  convict a malformed park the moment one exists. Three judgment rows are relayed, never run; their ruler
  is the operator at the sweep. A clean report means nothing mechanical failed, never that the contract is
  satisfied.
