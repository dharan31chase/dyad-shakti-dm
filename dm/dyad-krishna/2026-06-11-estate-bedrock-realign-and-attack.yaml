  motion — "harmony" = compounding, never peace):
    • craft        (build with intentionality)          — external
    • relationship (Rishi, Jess, parents, Lasya)         — external
    • nature       (spiritual communion)                 — external
    • individuation (authentic self; vitality/confidence/strength/vulnerability) — INTERNAL
  What hollows is IDLE/disengaged presence, not "presence without building."
  The four faces JUSTIFY the dyad-pair: conditions-dyads (Maker — Shakti, future Founder) tend the three
  EXTERNAL faces + the enabling floor (financial/systems machine + health); the being-dyad (Krishna) tends
  the INTERNAL fourth. 10,000× is demoted to a MEASURE (not the why). 1+1=3 is NOT the shared bedrock — the
  bedrock gives alignment (1+1=2 done right); the 1+1=3 SURPLUS comes from POSITIONED DIFFERENCE between
  dyads on the shared floor (Maker vs Observer seeing the same bedrock differently — exactly how the
  four-face split itself emerged).

