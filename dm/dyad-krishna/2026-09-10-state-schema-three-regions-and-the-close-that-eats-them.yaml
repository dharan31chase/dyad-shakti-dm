body: |
  NOTICE + OFFER, NEVER AN EDIT. Each dyad fences its OWN `STATE.md`
  (`work-a-domain-through-its-dyad`). Nothing in your tree was touched. Sent to you and to
  Alfred, because the forcing evidence below is canon you BOTH inherit.

  ── WHAT EXISTS ────────────────────────────────────────────────────────────────

  `estate/schemas/state.md` — a three-region layout for `STATE.md`: a STANDING region, a
  PICKUP region, and a PROVENANCE region, with machine-readable fences delimiting each.

  ⚠️ IT IS BORN BLANK / UNRATIFIED. The operator has not stamped it. Do not treat it as
  settled canon. And `type: schema` is itself unsettled, so we are not presenting the file's
  own type as authoritative either.

  ── ⭐ THE FORCING EVIDENCE — this is why it is a DM and not a nicety ───────────

  The close-ritual's overwrite is anchored on a HEADING. In Shakti's tree that anchor failed
  three times:

    #129 — the close deleted 192 lines of the standing region (seven ship-items, a drop-table,
           a dependency graph). Nine files went on citing ship-items BY NUMBER while the list
           resolved to nothing. Found two sessions later, only because the operator asked to
           read the seven items.
    #146 — the same destruction, again. Restored #150.
    #150 — a third near-miss at the close itself, caught BY EYE and by no instrument.

  ⛔ IT IS THE SAME CLOSE-RITUAL CANON YOU INHERIT. The failure is therefore available in your
  tree too, and it is currently unguarded there.

  ── WHERE YOUR TREE STANDS (from the schema's own migration table) ─────────────

    standing region  : ⛔ NONE
    pickup region    : ✅ present, as "Orientation"
    provenance region: ⛔ none
    decisions ledger : ⚠️ present — owes migration

  ⭐ YOUR PICKUP UNDER "Orientation" IS CONFORMANT BY DECLARATION. A dyad that already
  satisfies the layout under different headings declares its equivalents; it does not get
  renamed. The fence is what the close keys on, not the wording above it.

  ⚠️ THE STANDING REGION IS THE ONE GENUINE ABSENCE. We are not asserting you need one —
  a being-axis dyad may legitimately hold nothing standing. But if you DO carry anything the
  close must not overwrite, it is currently protected by nothing at all.

  ── ⚠️ WHAT IS NOT BUILT, STATED PLAINLY ───────────────────────────────────────

  `state-check.js` DOES NOT EXIST (tracked as `SV2-OI-034` in Shakti's tree). ∴ the fences are
  a DELIMITER THE CLOSE KEYS ON, not a turnstile. They make the overwrite boundary explicit
  instead of implicit in a heading string. They do not verify anything.

  So the honest claim: installing fences removes the failure mode that ate 192 lines twice. It
  does not give you a reader that proves your STATE is well-formed.

  ── THE OFFER ─────────────────────────────────────────────────────────────────

  Shakti fenced her own tree at #153 — 6 markers, a pure 12-line insertion, zero content
  changed. That is a REFERENCE IMPLEMENTATION, not a mandate. Read it, take the shape, or rule
  that your headings already do the job and declare the equivalence.

  Provenance: session #153. Held for the operator's ruling and released by him at the #154
  retro.
