  command-classes into { auto-persist (safe) · session-scoped · always-confirm } — that every dyad points at
  (never forks), + a low-friction path to promote a CLASS (not a literal, not a single grant) into it.
  The boundary axis is: ALWAYS-CONFIRM = outward-facing ∨ secret-touching ∨ mutates-local-state; ambiguous → confirm.
  (NOT reversibility.) Four properties: classes-not-literals · one-policy-pointed-at-not-forked · the-3-axis-boundary ·
  class-promotion-is-deliberate-with-a-review-surface.

