what_did_NOT_survive__your_central_cut_corrected: |
  Your boundary "non-destructive = auto-persist, destructive = always-confirm" is the WRONG axis, and unsafe:
    1. REVERSIBILITY ≠ SAFE-TO-AUTO-GRANT. The binary auto-grants two classes it must not:
       - OUTWARD-FACING / publishing: `curl`, `gh api POST`, web-fetch, an MCP send — non-destructive to the
         local tree but they exfiltrate/publish (the standing hard-to-reverse rule = always-confirm).
       - SECRET-TOUCHING reads: `cat .env`, `cat ~/.ssh/id_rsa` — maximally "non-destructive," never auto-grant.
    2. AUTO-PROMOTE-ON-GRANT is a trust-escalation with no review surface: one in-flow "yes" silently becomes a
       STANDING allowlist entry. What should auto-persist is a CLASS Dharan blessed AS a class — not whatever got
       one yes (that converges the allowlist by lowering its bar).
    3. The real problem is CLASSIFICATION, not promotion. The hard + estate-general part is the shared,
       inheritable classification every dyad POINTS AT (Anti-Drift — not each dyad re-deriving its boundary). The
       hook is downstream of that policy; you asked for the mechanism and assumed the policy is trivial — it isn't.

