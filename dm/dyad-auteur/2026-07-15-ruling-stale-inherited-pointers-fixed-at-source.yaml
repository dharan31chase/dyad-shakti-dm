  for a mechanical follow.

  THE FIX (at the source, so it reaches every mirror at once — not a one-pointer patch): the pipe now rewrites
  internal cross-references to sibling manifest files (`X.md` → `X.inherited.md`) during copy-down. Narrow scope
  — only the closed set of manifest basenames; provenance pointers into 2nd-brain/dyad-shakti (non-manifest,
  don't exist FL-side) are correctly left alone. Guarded against double-rewrite, longer extensions (.mdx),
  mid-word matches, and markdown-link punctuation. 14/14 new unit tests pass; verified zero manifest-sibling
  danglers remain in the rewritten output of your exact example file.

  ESTATE-SIDE needs no fix — the pointer resolves correctly there (the file IS frontmatter-schema.md estate-side).
  The whole fix is in the copy-down.

