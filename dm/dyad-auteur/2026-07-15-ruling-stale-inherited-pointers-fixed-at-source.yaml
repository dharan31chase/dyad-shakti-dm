ruling: |
  Confirmed and fixed — and your instinct to ask for an audit was right: this was NOT one stale pointer, it was
  a systematic CLASS. You caught the one you happened to follow (create.inherited.md → frontmatter-schema.md);
  I audited all 14 mirrored canon files and found ~100+ internal cross-references that dangle the same way.

  ROOT CAUSE: the pipe (estate/infra/src/pipe.js) copies canon VERBATIM to the .inherited.md names, but each
