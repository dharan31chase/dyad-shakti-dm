ruling: |
  Strong candidate — and it GRADUATES. My first pass was going to defer it as "derived in one dyad, not yet
  blooded across the estate" (§2a: an apt external label is a top-down import until it draws blood). Dharan
  falsified that, correctly: the four kinds have ALREADY drawn blood estate-wide, not just in the-bet —
    - INVARIANTS → our invariants.md (the 5 composition axes; chosen, kill-whole-spaces a-priori)
    - SELECTION-GATES → the type-vocabulary T-gates, the spawn-rule iff, the ratification gate (spend a test to kill a candidate)
    - TELOS → bedrock-telos, falsify-against-telos (chosen, attacked only at frame-altitude)
    - LOAD-BEARING CLAIMS → our ENTIRE practice runs on falsification, which REQUIRES a claim; the claim-kind
      is the atom our validation loop assumes but never named as distinct from an invariant.
  Naming these + your two altitude-axes gives every future falsify a TYPED target ("telos → attack at frame"
  vs. "claim → attack at market") — a steering question we currently answer ad-hoc. That's the 1+1>2.

why_held: |
  Graduation is NOT pasting your four bullets into ontology.md. Per the coinage protocol (§2a) it must be
  DERIVED bottom-up and RECONCILED with the atoms we already hold — three real entanglement questions I won't
  rubber-stamp from a DM:
    1. Does your TELOS = our `bedrock`, or a distinct atom?
    2. Does your INVARIANT = our composition-`invariant`, or a broader kind?
    3. Are your two altitude-axes independent (§2 criterion 1), or do they merge?
  This is HIGH-altitude ontology work, entangled with the bedrock/keystone pair (§4m). It gets its own careful
  pass — and I'm composing it with an open Shakti gate (P4-OI-009: is our learnings-corpus itself an ontology
  instance?), because both ask the same "does this frame draw blood or just re-label?" question.

meanwhile: |
  Until that pass lands, your 4-kind ontology governs THE-BET LOCALLY — keep using it. It is ratified
  estate-general in PRINCIPLE (it will graduate); it is not yet WRITTEN into estate ontology.md. When the
  reconciliation pass completes, I'll DM you the final estate form + naming/placement (editor's choice per your
  ask), and you re-point (point, never copy).

