  # Estate Bedrock (inherited, materialized copy-down) — the shareable subset

  > **What this is.** The bedrock life Dharan is living toward, and the structure of the dyad-practice that
  > serves it. It sits at the estate layer — above every dyad. No dyad owns it; every dyad derives its own why
  > from it. It is living (it evolves; the durable thing is the re-derivation discipline, not the content),
  > attackable by any dyad (it earns authority by surviving contention), and approachable by any dyad.
  >
  > **This is a COPY-DOWN, not the source.** The source of record is the estate bedrock (editor-of-record
  > Shakti, owned by none). This copy holds only the SHAREABLE subset; the personal-only gating layer is
  > deliberately absent. Re-pull deliberately when the source advances (compare source_commit).

  ## 1. The terminal — engaged communion (the life wanted for its own sake)

  The terminal value is deep, engaged communion with what is real, met through four **verbs of contact**:

  | Verb | Meeting the real through… | Mode |
  |---|---|---|
  | **Loving** | presence with the people he loves | acute |
  | **Making** | creation — building with craft, for its own sake | acute |
  | **Seeking** | curiosity — the will to know (the self and the world) | acute |
  | **Tending** | stewardship — keeping what is in his care well, across time | **chronic** |

  What hollows is *idle, disengaged* presence — not "presence without building." Any of the four engaged verbs
  nourishes; passive presence empties. (Asymmetry: making tolerates brief isolation; presence-with-nothing-
  engaged hollows fast — the failure mode to guard hardest is freedom-with-nothing-to-meet.)

  **Tending is the chronic verb — and the most neglected.** The other three announce themselves; tending stays
  silent until something breaks. Naming it makes the most-neglected mode of contact a thing to be accountable
  to, not a chore beneath the "real" verbs.

  ## 2. The keystone — the seer (what makes the verbs one motion)

  The verbs are not a portfolio to balance; they are **one motion** when they flow from one clear seat of
  awareness — the **seer** (awareness / mu). The more present and clear the seat, the more every verb flows from
  one place instead of pulling apart. "Harmony" means compounding, never peace: severed, each verb degrades;
  integrated, they feed each other. The seer is both the deepest why and the highest quality — at the terminal
  those coincide (the mark of the terminal). Below the terminal, in any dyad doing verb-work, "deepest why" and
  "highest quality" stay distinct — a normal tower.

  ## 3. How the work is owned — DOMAIN × SLICE

  The work of serving the terminal is divided by two questions, never by verb:
  1. **Which domain?** — a territory of the life.
  2. **Which slice of it?** — the part a dyad owns. One domain may grow several dyads, one per slice.

  The verbs are descriptive (what kind of meeting a piece of work is); they do not decide the owner. A single
  verb scatters across dyads. The owner is read off domain × slice.

  **Venture is a CATEGORY of domains, not one domain.** Each venture is its own domain, each growing its own
  dyad-cluster; ventures are peers. **FamilyLoom** is one such venture-domain; **Auteur** is FamilyLoom's
  vision-slice (its making/seeking/tending — for the venture), with ops and distribution dyads added as load
  demands. The terminal itself is un-owned: the actual living of the verbs is Dharan's, un-delegated. Dyads own
  a domain's CONDITIONS or its inner face; no dyad owns a terminal-in-the-world. Dyads exist so the terminal is
  reachable by default, never to live it for him.

  ## 4. The spawn-rule — when a new dyad is born (falsifiable)

  > A new dyad is born **iff** a (domain × slice) cell is **both** (a) a recurring, load-bearing part of the
  > actual life **and** (b) unowned by any existing dyad.
  > - If the slice is already owned → reject (redundancy — 1+1=2, not 1+1=3).
  > - If the slice is real but not yet load-bearing → defer (premature).

  This is the 1+1=3 / positioned-difference test made operational: a dyad earns its existence only by occupying
  a position no existing dyad occupies — never by adding capacity to an occupied one.

  > **A home is not a dyad.** This rule governs when a *dyad* is born; it does not forbid standing up a domain's
  > substrate *home*, stewarded by an existing dyad, once its content is load-bearing — before its own dyad
  > exists. The eventual dyad inherits the populated tree.

