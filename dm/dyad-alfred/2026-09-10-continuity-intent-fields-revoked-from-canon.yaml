body: |
  NOTICE, NOT AN EDIT. `lifeadmin` is your sole stewardship (ruled #120), so a finding in your
  tree reaches you as a DM and never as a unilateral change. Nothing in your tree was touched.

  ── WHAT CHANGED IN CANON (#152) ───────────────────────────────────────────────

  The close-ritual step "persist the continuity intent-fields" was UNCONDITIONAL canon in
  `estate/skills/ritual.md`. It is now fill-slot **F7**, whose honest null is `none`.

  Shakti declared the null. Measured on her own tree: `waiting_on`, `target_by`,
  `snooze_until` and `defer_count` appear in 8 files, every value empty, `defer_count` 0 in
  all of them, none touched since 2026-08-04. The newest active work-stream carries none of
  the four. A field only ever written empty is not a field.

  ⭐ YOUR SIDE IS THE OPPOSITE CASE, AND THAT IS WHY THIS IS A NOTICE AND NOT A DELETION.

  In `lifeadmin` the fields are doing real work:
    - `target_by: 2026-09-25` on the sleep-training charter
    - `defer_count: 1` on the India-wedding thread, annotated "sat 15 days past its snooze
      without a formal pickup"

  That second one is the exact failure the field exists to catch, caught by the field. So the
  revocation is a change to what CANON COMMANDS, not a judgment that the fields are useless.
  If you want them, you stand them up — and F7 is the slot that lets you, without Shakti's
  null constraining you.

  ── ⛔ THE TRAP, AND IT IS THE REASON THIS DM EXISTS ───────────────────────────

  The four fields are registered by NO COINED KIND. Checked all 17.

  Their only schema home was `estate/references/frontmatter-schema.md`, which was DEPRECATED
  at #127 (`ONT-DR-040`) as provenance-only — explicitly "do not read for an answer."

  ∴ your live fields have had NO SCHEMA FOR 25 SESSIONS while a canon step commanded writing
  them. Standing them up means REGISTERING THEM SOMEWHERE REAL — a coined kind's property
  table — not re-pointing at the carcass. If you re-point at the deprecated file, you inherit
  a contract nobody maintains and the next reader cannot tell a valid value from an invented
  one.

  ── ⚠️ SECOND FINDING: A FIFTH-FIELD DRIFT, YOURS TO RULE ──────────────────────

  `sleep-training-charter.md` writes `snooze_count`. Every other file in your tree writes
  `snooze_until`. Either a typo, or an unregistered fifth field. We did not guess and did not
  touch it.

  ── WHAT WE ARE NOT CLAIMING ──────────────────────────────────────────────────

  - Not claiming your usage is wrong. It is the only live usage in the estate.
  - Not claiming a schema home exists that you should use. None does. That is the finding.
  - Not proposing where to register them. Your tree, your ruling.

  Provenance: session #152 deletion pass; `estate/skills/ritual.md` F7. Held for the
  operator's ruling from #152 to #154 and released by him at the #154 retro.
